  <g><rect x="60" y="210" width="2080" height="1570" rx="20" fill="#F8FAFF" stroke="#BFDBFE" stroke-width="2"/><rect x="60" y="210" width="2080" height="56" rx="20" fill="#BFDBFE" fill-opacity="0.30"/><text x="88" y="246" fill="#1E40AF" class="lane-title">PHÒNG ĐIỀU DƯỠNG</text></g>
  <g><path d="M500,347.5 L535,347.5 L535,347.5 L570,347.5" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M950,347.5 L985,347.5 L985,347.5 L1020,347.5" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M1400,347.5 L1455,347.5 L1455,347.5 L1510,347.5" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M1700,410 L1700,462.5 L1700,462.5 L1700,515" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M1510,582.5 L1455,582.5 L1455,582.5 L1400,582.5" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M1020,582.5 L985,582.5 L985,582.5 L950,582.5" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M570,582.5 L455,582.5 L455,582.5 L340,582.5" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M230,650 L230,705 L310,705 L310,760" fill="none" stroke="#DC2626" stroke-width="2.4"  marker-end="url(#arrow-red)"/><g transform="translate(310,697)"><rect x="-38" y="-13" width="76" height="24" rx="8" fill="#FFFFFF" fill-opacity="0.94" stroke="#E2E8F0"/><text text-anchor="middle" dominant-baseline="central" class="edge-label">có</text></g><path d="M340,582.5 L80,590 L80,690 L1700,690 L1700,730 L1510,832.5" fill="none" stroke="#16A34A" stroke-width="2.4"  marker-end="url(#arrow-green)"/><g transform="translate(1700,682)"><rect x="-59.2" y="-13" width="118.4" height="24" rx="8" fill="#FFFFFF" fill-opacity="0.94" stroke="#E2E8F0"/><text text-anchor="middle" dominant-baseline="central" class="edge-label">không / đã xử lý</text></g><path d="M500,832.5 L535,832.5 L535,832.5 L570,832.5" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M950,832.5 L985,832.5 L985,832.5 L1020,832.5" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M1400,832.5 L1455,832.5 L1455,832.5 L1510,832.5" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M1700,905 L1700,960 L1700,960 L1700,1015" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M1510,1087.5 L1455,1087.5 L1455,1087.5 L1400,1087.5" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M1020,1087.5 L985,1087.5 L985,1087.5 L950,1087.5" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M570,1087.5 L535,1087.5 L535,1087.5 L500,1087.5" fill="none" stroke="#475569" stroke-width="2.4"  marker-end="url(#arrow-slate)"/><path d="M310,1160 L310,1217.5 L310,1217.5 L310,1275" fill="none" stroke="#D97706" stroke-width="2.4"  marker-end="url(#arrow-amber)"/><g transform="translate(310,1209.5)"><rect x="-40.7" y="-13" width="81.4" height="24" rx="8" fill="#FFFFFF" fill-opacity="0.94" stroke="#E2E8F0"/><text text-anchor="middle" dominant-baseline="central" class="edge-label">sắp hết sớm</text></g><path d="M310,1275 L70,1345 L70,350 L100,350 L310,410" fill="none" stroke="#D97706" stroke-width="2.4" stroke-dasharray="9 7" marker-end="url(#arrow-amber)"/><g transform="translate(70,342)"><rect x="-55.5" y="-13" width="111" height="24" rx="8" fill="#FFFFFF" fill-opacity="0.94" stroke="#E2E8F0"/><text text-anchor="middle" dominant-baseline="central" class="edge-label">đợt bổ sung mới</text></g><path d="M1700,650 L1700,955 L1700,955 L1700,1260" fill="none" stroke="#D97706" stroke-width="2.4" stroke-dasharray="9 7" marker-end="url(#arrow-amber)"/><g transform="translate(1700,947)"><rect x="-66.60000000000001" y="-13" width="133.20000000000002" height="24" rx="8" fill="#FFFFFF" fill-opacity="0.94" stroke="#E2E8F0"/><text text-anchor="middle" dominant-baseline="central" class="edge-label">chưa có thuật toán</text></g><path d="M1700,905 L1352.5,905 L1352.5,1500 L1005,1500" fill="none" stroke="#D97706" stroke-width="2.4" stroke-dasharray="9 7" marker-end="url(#arrow-amber)"/><g transform="translate(1352.5,1492)"><rect x="-70.3" y="-13" width="140.6" height="24" rx="8" fill="#FFFFFF" fill-opacity="0.94" stroke="#E2E8F0"/><text text-anchor="middle" dominant-baseline="central" class="edge-label">scope chốt quá rộng</text></g></g>
  <g><g><rect x="120" y="285" width="380" height="125" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="310" y="330.34" text-anchor="middle" fill="#1E3A8A" class="node-title">1. Tạo / mở đợt</text><text x="310" y="352.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Chọn loại mua sắm, năm, mốc T1/T5/T9 nếu bổ sung</text><text x="310" y="374.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Đóng đợt sẽ chặn Khoa gửi ở DB</text></g><g><rect x="570" y="285" width="380" height="125" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="760" y="330.34" text-anchor="middle" fill="#1E3A8A" class="node-title">2. Bàn điều hành</text><text x="760" y="352.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Chọn đợt + gói con</text><text x="760" y="374.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Theo dõi đề xuất / Word / chốt của 62 Khoa</text></g><g><rect x="1020" y="285" width="380" height="125" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="1210" y="330.34" text-anchor="middle" fill="#1E3A8A" class="node-title">3. Theo dõi &amp; nhắc</text><text x="1210" y="352.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Lọc Khoa chưa gửi / thiếu Word / chưa chốt</text><text x="1210" y="374.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Copy mẫu nhắc Zalo / Email / Teams</text></g><g><rect x="1510" y="285" width="380" height="125" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="1700" y="330.34" text-anchor="middle" fill="#1E3A8A" class="node-title">4. Danh mục tổng hợp</text><text x="1700" y="352.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Cộng theo mã hàng trong đúng đợt + gói con</text><text x="1700" y="374.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Mở chi tiết đóng góp từng Khoa</text></g><g><rect x="1510" y="515" width="380" height="135" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="1700" y="565.34" text-anchor="middle" fill="#1E3A8A" class="node-title">5. Hiệu chỉnh có audit</text><text x="1700" y="587.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Sửa đè, khóa dòng/cột, ẩn cột</text><text x="1700" y="609.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Khoa thấy phần PĐD sửa nhưng không được ghi</text></g><g><rect x="1020" y="515" width="380" height="135" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="1210" y="565.34" text-anchor="middle" fill="#1E3A8A" class="node-title">6. Hồ sơ trình ký</text><text x="1210" y="587.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Xuất Excel danh mục đi thầu</text><text x="1210" y="609.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Tạo Word Phiếu đề nghị mua thầu</text></g><g><rect x="570" y="515" width="380" height="135" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="760" y="565.34" text-anchor="middle" fill="#1E3A8A" class="node-title">7. Ba giai đoạn thầu</text><text x="760" y="587.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Chào giá → Mở thầu → Đánh giá</text><text x="760" y="609.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Chỉ chọn mã rớt + giai đoạn + lý do</text></g><g><polygon points="230,515 340,582.5 230,650 120,582.5" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.4" filter="url(#shadow)"/><text x="230" y="586.9" text-anchor="middle" fill="#7C2D12" class="decision-title">Có mã rớt?</text></g><g><rect x="120" y="760" width="380" height="145" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.4"  filter="url(#shadow)"/><text x="310" y="815.34" text-anchor="middle" fill="#7F1D1D" class="node-title">8a. Rớt 1 phần / cả nhóm</text><text x="310" y="837.34" text-anchor="middle" fill="#7F1D1D" class="node-line">Tự sync kết quả về mọi Khoa liên quan</text><text x="310" y="859.34" text-anchor="middle" fill="#7F1D1D" class="node-line">Có đường bỏ tích nếu chưa xử lý</text></g><g><rect x="570" y="760" width="380" height="145" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="760" y="815.34" text-anchor="middle" fill="#1E3A8A" class="node-title">8b. Giỏ rớt toàn viện</text><text x="760" y="837.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Theo dõi Khoa còn mã chưa xử lý + số ngày</text><text x="760" y="859.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Nhắc Khoa chuyển SL hoặc sang đợt bổ sung</text></g><g><rect x="1020" y="760" width="380" height="145" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.4"  filter="url(#shadow)"/><text x="1210" y="815.34" text-anchor="middle" fill="#4C1D95" class="node-title">9. Chờ Khoa xử lý</text><text x="1210" y="837.34" text-anchor="middle" fill="#4C1D95" class="node-line">Rớt 1 phần: tổng đổi khi tải lại</text><text x="1210" y="859.34" text-anchor="middle" fill="#4C1D95" class="node-line">Rớt hoàn toàn: Khoa đưa vào giỏ bổ sung</text></g><g><rect x="1510" y="760" width="380" height="145" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="2.4"  filter="url(#shadow)"/><text x="1700" y="815.34" text-anchor="middle" fill="#78350F" class="node-title">10. Một cờ chốt / hai thời điểm</text><text x="1700" y="837.34" text-anchor="middle" fill="#78350F" class="node-line">UI: chốt số đi thầu; docs: chốt sau thầu</text><text x="1700" y="859.34" text-anchor="middle" fill="#78350F" class="node-line">Hiện chỉ khóa dot_id, rộng hơn một gói con</text></g><g><rect x="1510" y="1015" width="380" height="145" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.4"  filter="url(#shadow)"/><text x="1700" y="1070.34" text-anchor="middle" fill="#14532D" class="node-title">11. Hoàn thiện kết quả</text><text x="1700" y="1092.34" text-anchor="middle" fill="#14532D" class="node-line">Mã không bị tích → mặc định trúng</text><text x="1700" y="1114.34" text-anchor="middle" fill="#14532D" class="node-line">Tự tạo gói theo dõi + đủ 5 mốc</text></g><g><rect x="1020" y="1015" width="380" height="145" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="1210" y="1070.34" text-anchor="middle" fill="#1E3A8A" class="node-title">12. Hợp đồng</text><text x="1210" y="1092.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Hoàn thành mốc ký hợp đồng</text><text x="1210" y="1114.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Theo dõi số trúng thầu</text></g><g><rect x="570" y="1015" width="380" height="145" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="760" y="1070.34" text-anchor="middle" fill="#1E3A8A" class="node-title">13. Hàng về đợt đầu</text><text x="760" y="1092.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Đánh dấu ngày hàng về</text><text x="760" y="1114.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Từ đây mới bắt đầu tính cam kết sử dụng</text></g><g><rect x="120" y="1015" width="380" height="145" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="310" y="1070.34" text-anchor="middle" fill="#1E3A8A" class="node-title">14. Giám sát sử dụng</text><text x="310" y="1092.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Nạp HIS; chỉnh ngưỡng 6/12/18 tháng</text><text x="310" y="1114.34" text-anchor="middle" fill="#1E3A8A" class="node-line">Cảnh báo chậm cam kết và sắp hết sớm</text></g><g><rect x="120" y="1275" width="380" height="140" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="310" y="1327.84" text-anchor="middle" fill="#1E3A8A" class="node-title">15. Mở vòng bổ sung</text><text x="310" y="1349.84" text-anchor="middle" fill="#1E3A8A" class="node-line">Khi có mã rớt hoàn toàn hoặc nguy cơ hết sớm</text><text x="310" y="1371.84" text-anchor="middle" fill="#1E3A8A" class="node-line">Quay lại tạo / mở đợt bổ sung</text></g><g><rect x="570" y="1275" width="380" height="140" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="760" y="1327.84" text-anchor="middle" fill="#1E3A8A" class="node-title">Luồng dùng chung</text><text x="760" y="1349.84" text-anchor="middle" fill="#1E3A8A" class="node-line">Xử lý Sổ thiếu hàng</text><text x="760" y="1371.84" text-anchor="middle" fill="#1E3A8A" class="node-line">Duyệt / trả lại sự kiện nhu cầu</text></g><g><rect x="1020" y="1275" width="380" height="140" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"  filter="url(#shadow)"/><text x="1210" y="1327.84" text-anchor="middle" fill="#1E3A8A" class="node-title">Danh mục kỹ thuật</text><text x="1210" y="1349.84" text-anchor="middle" fill="#1E3A8A" class="node-line">Gán mã hàng / mã quản lý</text><text x="1210" y="1371.84" text-anchor="middle" fill="#1E3A8A" class="node-line">Duyệt hoặc từ chối mã mới và sửa tiêu chí</text></g><g><rect x="1510" y="1260" width="380" height="170" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2.4" stroke-dasharray="9 6" filter="url(#shadow)"/><text x="1700" y="1327.84" text-anchor="middle" fill="#78350F" class="note-title">Khoảng trống cần quyết định</text><text x="1700" y="1349.84" text-anchor="middle" fill="#78350F" class="note-line">Sửa tổng toàn viện chưa tự chia lại proposal từng Khoa.</text><text x="1700" y="1371.84" text-anchor="middle" fill="#78350F" class="note-line">Hiện Khoa chỉ nhìn thấy số sửa đè và lịch sử audit.</text></g><g><rect x="120" y="1500" width="1770" height="165" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2.4" stroke-dasharray="9 6" filter="url(#shadow)"/><text x="1005" y="1565.34" text-anchor="middle" fill="#78350F" class="note-title">Lỗi mô hình phạm vi: Đợt × Gói con chưa thành một thực thể DB thống nhất</text><text x="1005" y="1587.34" text-anchor="middle" fill="#78350F" class="note-line">danh_muc_dot_chot chỉ có PK dot_id; patch tạo kết quả mặc định cho mọi proposal trong đợt. PĐD override dùng goi_id:dot:dot_id,</text><text x="1005" y="1609.34" text-anchor="middle" fill="#78350F" class="note-line">nhưng view số chốt và màn Khoa còn dùng goi_id tĩnh. Vì vậy không được hiểu thao tác chốt hiện tại là đã cô lập tuyệt đối từng gói con.</text></g></g>
