    <line x1="260" y1="62" x2="326" y2="62" stroke="#D97706" stroke-width="2.4" stroke-dasharray="9 7" marker-end="url(#arrow-amber)"/><text x="340" y="66" class="legend">Vòng lặp / lưu ý / chưa nối đủ</text>
